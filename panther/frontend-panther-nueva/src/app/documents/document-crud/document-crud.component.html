<div class="page-container">
    <h2 class="title">📄 Gestión de Tipos de Documento</h2>

    <div class="card form-card">
        <h3 class="form-title">
            {{ document.id ? '✏ Editar Documento' : '➕ Crear Nuevo Documento' }}
        </h3>

        <form class="form-grid" (ngSubmit)="saveDocument()">
            <div class="form-group">
                <label>Nombre Largo</label>
                <input type="text" [(ngModel)]="document.name_long" name="name_long" required />
            </div>

            <div class="form-group">
                <label>Nombre Corto</label>
                <input type="text" [(ngModel)]="document.name_short" name="name_short" required />
            </div>

            <div class="button-wrapper">
                <button class="btn-primary" type="submit" [disabled]="saving">
                    {{ saving ? 'Guardando...' : (document.id ? 'Actualizar Documento' : 'Crear Documento') }}
                </button>
                <button type="button" (click)="cancelEdit()" [disabled]="saving">Cancelar</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h3 class="section-title">📋 Lista de Documentos</h3>

        <table class="styled-table" *ngIf="documents.length">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre Largo</th>
                    <th>Nombre Corto</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let doc of documents">
                    <td>{{ doc.id }}</td>
                    <td>{{ doc.name_long }}</td>
                    <td>{{ doc.name_short }}</td>
                    <td class="actions-cell">
                        <button class="btn-edit" (click)="editDocument(doc)">✏ Editar</button>
                        <button class="btn-delete" (click)="deleteDocument(doc.id)">🗑 Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div *ngIf="!documents || documents.length === 0">
            No hay tipos de documento.
        </div>
    </div>

</div>
